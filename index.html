
<style>

#fairy-ad {

}

#fairy-ad:before {

}

.fairy-content {

}

.fairy-top {

}

.fairy-title {

  line-height:1.3;
  margin:25px 0;
  text-shadow:0 5px 25px #0008;

}

.fairy-title span {

  color:#ffe0a4;
}

.fairy-description {

}

.fairy-price {

  box-shadow:0 0 35px #ffcf8130;
  animation:fairyBoom 1.2s 1s both;
}

.fairy-price small {
  display:block;
  color:#ffdf9e;
  font-size:20px;
  font-weight:800;
  letter-spacing:2px;
  margin-bottom:7px;
}

.fairy-price strong {
  display:block;
  font-size:49px;
  color:#fff0c7;
  font-weight:800;
}

.fairy-gift {
  margin-top:22px;
  font-size:17px;
  line-height:1.9;
  color:#fff5e6;
  animation:fairyUp 1s 1.4s both;
}

.fairy-gift span {
  color:#ffdc9b;
  font-weight:800;
}

.fairy-call {
  display:inline-block;
  margin-top:27px;
  padding:18px 28px;
  background:linear-gradient(135deg,#ffe7b9,#d6a45d);
  color:#321628 !important;
  text-decoration:none !important;
  font-size:15px;
  font-weight:800;
  border-radius:4px;
  box-shadow:0 8px 30px #ffcf8140;
  transition:.3s;
  animation:fairyUp 1s 1.7s both;
}

.fairy-call:hover {
  transform:translateY(-4px) scale(1.04);
  box-shadow:0 12px 35px #ffcf8170;
}

.fairy-sparkle {
  position:absolute;
  color:#ffe2ad;
  text-shadow:0 0 18px #ffd58a;
  pointer-events:none;
  animation:fairySparkle 3s infinite;
}

.fairy-sparkle.a {
  top:15%;
  right:13%;
  font-size:38px;
}

.fairy-sparkle.b {
  top:65%;
  right:20%;
  font-size:25px;
  animation-delay:1s;
}

.fairy-sparkle.c {
  top:35%;
  right:8%;
  font-size:20px;
  animation-delay:2s;
}

@keyframes fairyFade {
  from {opacity:0}
  to {opacity:1}
}

@keyframes fairyUp {
  from {opacity:0;transform:translateY(30px)}
  to {opacity:1;transform:translateY(0)}
}

@keyframes fairyBoom {
  0% {opacity:0;transform:scale(.5)}
  65% {opacity:1;transform:scale(1.13)}
  100% {opacity:1;transform:scale(1)}
}

@keyframes fairySparkle {
  0%,100% {opacity:.3;transform:scale(.7) rotate(0)}
  50% {opacity:1;transform:scale(1.5) rotate(35deg)}
}

@media(max-width:600px) {
  #fairy-ad {
    height:740px;
    min-height:740px;
  }

  #fairy-ad:before {
    background:linear-gradient(
      0deg,
      rgba(20,5,22,.97),
      rgba(20,5,22,.65) 65%,
      rgba(20,5,22,.12)
    );
  }

  .fairy-content {
    left:0;
    right:0;
    top:auto;
    bottom:5%;
    transform:none;
    padding:20px;
    text-align:center;
  }

  .fairy-title {
    font-size:45px;
    margin:17px 0;
  }

  .fairy-description {
    font-size:14px;
  }

  .fairy-price strong {
    font-size:40px;
  }

  .fairy-price small {
    font-size:17px;
  }

  .fairy-gift {
    font-size:14px;
  }

  .fairy-call {
    font-size:13px;
    padding:16px 19px;
  }
}
</style>
